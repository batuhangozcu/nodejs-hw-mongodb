tags:
  - Contacts
summary: Create a new contact
operationId: addContact
description: 'Create a new contact'
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - contactType
        properties:
          name:
            type: string
          phoneNumber:
            type: string
          contactType:
            type: string
            enum: [personal, home, work]
          isFavorite:
            type: boolean
          email:
            type: string
            format: email
          photo:
            type: string
            format: binary
            description: Contact photo
responses:
  '201':
    description: 'Contact created successfully'
  content:
    application/json:
      schema:
        type: object
        required:
          - status
          - message
          - data
        properties:
          status:
            type: integer
            example: 201
          message:
            type: string
            example: 'Contact created successfully'
          data:
            $ref: '../../components/schemas/contact.yaml'
  '401':
    $ref: '../../components/responses/401.yaml'
